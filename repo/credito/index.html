<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body { margin: 0; padding: 0; background: #E6E5E1; overflow-x: hidden; }
  body { font-family: Inter, system-ui, sans-serif; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes lcspin { to { transform: rotate(360deg); } }
  @keyframes lc-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes cr-spin { to { transform: rotate(360deg); } }
  @keyframes lc-shine { 0% { transform: translateX(-160%) skewX(-14deg); } 60%,100% { transform: translateX(460%) skewX(-14deg); } }
  @keyframes ob-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes ob-ring { 0% { transform: scale(0.55); opacity: 0.85; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes ob-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes ob-shadow { 0%, 100% { transform: scaleX(1); opacity: 0.6; } 50% { transform: scaleX(0.82); opacity: 0.34; } }
  @keyframes cr-pop { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes cr-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .lc-spin { animation: lcspin 0.9s linear infinite; }
</style>
