<script type="text/babel">
// ── ios-frame.jsx (inline generado por build.py — editar el .jsx, no esto) ──
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: title, dark, keyboard):
//
//   <IOSDevice title="Settings">
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark title="Search" keyboard>…</IOSDevice>
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<script type="text/babel">

const CARD_DESIGNS = [

  { id: 'violeta', name: 'Violeta', users: '78k',
    bg: 'linear-gradient(120deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 24%, rgba(255,255,255,0) 58%, rgba(255,255,255,0.12) 76%, rgba(255,255,255,0) 100%), radial-gradient(150% 130% at 76% 12%, #9460e0 0%, #6a3fb0 28%, #3a1c64 62%, #1c0c36 100%)',
    ring: 'radial-gradient(circle at 38% 32%, #2c1550, #160a2c)', leaf: 'rgba(214,196,255,0.95)', vein: 'rgba(40,18,72,0.55)', ringBorder: '1px solid rgba(190,160,255,0.35)' },

// ── Card art (virtual designs + física/crédito skins) ───────────
// `design` (Tetrish, Pink, …) wins for virtual cards; otherwise `variant`
// (fisica = boutique teal/lime · credito = black VISA).
function CardArt({ variant = 'virtual', design, width = 320, portrait = false, faded = false, glow = false, shimmer = false, style = {} }) {
  const h = Math.round(width / (portrait ? 0.63 : 1.585));
  const r = Math.max(8, Math.round(width * 0.062));
  const pad = Math.round(width * 0.058);
  const logo = Math.round(width * 0.30);

  const variantSkins = {
    fisica: {
      bg: 'radial-gradient(130% 120% at 22% 18%, #2ea36f 0%, #11614f 30%, #0c3338 60%, #08171d 100%), linear-gradient(120deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.08) 80%, rgba(255,255,255,0) 100%)',
      ring: 'radial-gradient(circle at 40% 34%, #d9ff4a, #a8df00)',
      leaf: '#0c241c', vein: 'rgba(12,36,28,0.35)',
      ringBorder: '1px solid rgba(255,255,255,0.18)', coins: true
    },
    credito: {
      bg: 'radial-gradient(130% 120% at 70% 15%, #3a3a3c 0%, #1f1f21 45%, #131315 100%), linear-gradient(120deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 24%, rgba(255,255,255,0) 62%, rgba(255,140,60,0.10) 82%, rgba(255,255,255,0) 100%)',
      ring: 'radial-gradient(circle at 40% 34%, #2a2a2c, #161617)',
      leaf: 'rgba(255,160,90,0.9)', vein: 'rgba(0,0,0,0.4)',
      ringBorder: '1px solid rgba(255,255,255,0.14)'
    }
  };
  // resolve the skin: design (virtual) overrides; física/crédito keep their look
  const s = (variant === 'fisica' || variant === 'credito') ? variantSkins[variant] : getDesign(design || 'violeta');
  const isTetris = s.art === 'tetris';
  const chromeDark = isTetris || s.dark;
  const chrome = chromeDark ? 'rgba(18,18,18,0.85)' : '#fff';
  const glowRGB = variant === 'fisica' ? '14,61,79' : isTetris ? '20,160,70' : '76,48,124';

  return (
    <div style={{
      width, height: h, borderRadius: r, position: 'relative', overflow: 'hidden',
      background: s.bg, color: chrome, flexShrink: 0,
      // el borde negro de la Tetrish ya viene en assets/tetris.png
      border: 'none',
      boxShadow: glow ?
      `0 18px 40px rgba(${glowRGB},0.45), inset 0 1px 0 rgba(255,255,255,0.18)` :
      'inset 0 1px 0 rgba(255,255,255,0.16), 0 6px 16px rgba(0,0,0,0.18)',
      opacity: faded ? 0.4 : 1, filter: faded ? 'grayscale(0.4)' : 'none',
      transition: 'opacity .3s, filter .3s, background .6s ease', ...style
    }}>
      {isTetris ?
      // Tetrish real (assets/tetris.png, arte vertical): directa en portrait,
      // rotada 90° para los usos horizontales.
      <img src="assets/tetris.png" alt="" style={portrait ?
        { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' } :
        { position: 'absolute', left: '50%', top: '50%', width: h, height: width, transform: 'translate(-50%,-50%) rotate(90deg)', objectFit: 'cover' }} /> :
      isTetris === false &&
      // center isotipo ring
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{
          width: logo, height: logo, borderRadius: 999, background: s.ring,
          border: s.ringBorder, display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: 'inset 0 2px 6px rgba(0,0,0,0.3)'
        }}>
            <Leaf size={logo * 0.56} color={s.leaf} vein={s.vein} />
          </div>
        </div>}

      {/* NFC top-right */}
      <div style={{ position: 'absolute', top: pad, right: pad }}>
        <Nfc size={Math.round(width * 0.072)} color={chromeDark ? 'rgba(18,18,18,0.7)' : 'rgba(255,255,255,0.92)'} />
      </div>

      {!isTetris &&
      <>
        {/* coin badges bottom-left (física) / dots (virtual) */}
        <div style={{ position: 'absolute', left: pad, bottom: pad, display: 'flex', gap: width * 0.018, alignItems: 'center' }}>
          {s.coins ?
          <>
              <Coin label="₿" bg="#F7931A" size={Math.round(width * 0.066)} />
              <Coin label="Ξ" bg="#5b6b8c" size={Math.round(width * 0.066)} />
            </> :
          <>
              <span style={{ width: width * 0.04, height: width * 0.04, borderRadius: 999, border: '1.5px solid rgba(255,255,255,0.6)', display: 'inline-block' }} />
              <span style={{ width: width * 0.032, height: width * 0.032, background: 'rgba(255,255,255,0.5)', transform: 'rotate(45deg)', display: 'inline-block' }} />
            </>}
        </div>
        {/* VISA bottom-right */}
        <div style={{ position: 'absolute', right: pad, bottom: Math.round(pad * 0.7) }}>
          <VisaMark size={Math.round(width * 0.092)} color={chrome} shadow={!chromeDark} />
        </div>
      </>}

      {/* shimmer sweep (selection screen) */}
      {shimmer &&
      <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
          <div style={{
          position: 'absolute', top: '-30%', left: 0, width: '45%', height: '160%',
          background: 'linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent)',
          animation: 'lc-shimmer 2.4s ease-in-out infinite'
        }} />
        </div>}
    </div>);

}

// fila marquee: las tarjetas duplicadas para loop sin costura; tap para elegir
function MarqueeRow({ items, selId, onPick, dur = 24, reverse = false, w = 96 }) {
  const loop = [...items, ...items];
  return (
    <div style={{ overflow: 'hidden', width: '100%', maskImage: 'linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)', WebkitMaskImage: 'linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)' }}>
      <div style={{ display: 'flex', gap: 12, width: 'max-content', animation: `lc-marq ${dur}s linear infinite${reverse ? ' reverse' : ''}` }}>
        {loop.map((d, i) =>
        <button key={i} onClick={() => onPick(d.id)} style={{
          flexShrink: 0, padding: 3, borderRadius: 14, cursor: 'pointer', background: 'transparent',
          border: d.id === selId ? '2px solid var(--c-lime-40)' : '2px solid transparent',
          transition: 'transform .2s', transform: d.id === selId ? 'scale(1.04)' : 'scale(1)'
        }}>
            <CardArt design={d.id} width={w} glow={d.id === selId} />
          </button>)}
      </div>
    </div>);

}

// ── Design picker ───────────────────────────────────────────────
// El diferencial: carrusel ↔ grilla, prueba social, tap para rotar + brillo.
function DesignPicker({ onBack, onClose, onChoose, headline = 'Elegí el diseño' }) {
  const [idx, setIdx] = useStateCX(0);
  const [grid, setGrid] = useStateCX(false);
  const [tilt, setTilt] = useStateCX(false); // tap → rota y brilla
  const design = CARD_DESIGNS[idx];

  // tap en la tarjeta del carrusel: pequeño giro + shimmer
  const poke = () => { setTilt(true); setTimeout(() => setTilt(false), 900); };
  // elegir un diseño desde las filas en movimiento
  const pick = (id) => { const i = CARD_DESIGNS.findIndex((d) => d.id === id); if (i >= 0) { setIdx(i); setTilt(true); setTimeout(() => setTilt(false), 700); } };

  return (
    <Screen footer={
    <Btn variant="primary" onClick={() => onChoose(design)}>
        Elegir y crear tarjeta
      </Btn>
    }>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', height: 52 }}>
        <button onClick={onBack} style={{ border: 0, background: 'transparent', cursor: 'pointer', width: 40, height: 40 }}>
          <LI name="arrow-back" size={22} color={LX.text1} />
        </button>
        <div style={{ flex: 1, textAlign: 'center', font: '600 16px Inter', color: LX.text1 }}>{headline}</div>
        <span style={{ width: 40, height: 40 }} />
      </div>

      {grid ?
      // ── GRILLA ──
      <div style={{ padding: '8px 16px 8px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            {CARD_DESIGNS.map((d, i) =>
          <button key={d.id} onClick={() => { setIdx(i); setGrid(false); }} style={{
            border: idx === i ? '2px solid var(--c-lime-40)' : '2px solid transparent',
            borderRadius: 16, padding: 6, background: 'transparent', cursor: 'pointer'
          }}>
                <CardArt design={d.id} width={140} />
                <div style={{ font: '600 13px Inter', color: LX.text1, marginTop: 8 }}>{d.name}</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 4, font: '400 11px Inter', color: LX.text3, marginTop: 1 }}>
                  <LI name="user" size={11} color={LX.text3} /> {d.users} la eligieron
                </div>
              </button>
          )}
          </div>
        </div> :

      // ── CARRUSEL ──
      <div style={{ padding: '4px 0 8px' }}>
          <div
          onClick={poke}
          style={{
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            minHeight: 230, perspective: 1000, cursor: 'pointer'
          }}>
            <div style={{
            transform: tilt ? 'rotateY(-18deg) rotateX(6deg) scale(1.03)' : 'rotateY(0) scale(1)',
            transition: `transform .9s ${SPRING}`, transformStyle: 'preserve-3d'
          }}>
              <CardArt design={design.id} width={300} glow shimmer={tilt} />
            </div>
          </div>

          {/* nombre + prueba social */}
          <div style={{ textAlign: 'center', marginTop: 14 }}>
            <div style={{ font: '500 24px Geist', letterSpacing: '-0.02em', color: LX.text1 }}>{design.name}</div>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, marginTop: 8, background: LX.layer3, padding: '6px 12px', borderRadius: 999 }}>
              <span style={{ display: 'flex' }}>
                {['#FFB35C', '#7B4EC8', '#2BE76B'].map((c, i) =>
              <span key={i} style={{ width: 18, height: 18, borderRadius: 999, background: c, border: '2px solid var(--bg-layer-01)', marginLeft: i ? -6 : 0 }} />)}
              </span>
              <span style={{ font: '600 12px Inter', color: LX.text2 }}>{design.users} la eligieron</span>
            </div>
            <div style={{ font: '400 12px Inter', color: LX.text3, marginTop: 8 }}>Tocá la tarjeta y disfruta la magia.</div>
          </div>

          {/* dos filas en movimiento constante — elegí tocando cualquiera */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 20 }}>
            <MarqueeRow items={CARD_DESIGNS} selId={design.id} onPick={pick} dur={26} />
            <MarqueeRow items={[...CARD_DESIGNS].slice().reverse()} selId={design.id} onPick={pick} dur={32} reverse />
          </div>
        </div>}

      <div style={{ padding: '6px 16px 0' }}>
        <div style={{ font: '400 12px Inter', color: LX.text3, textAlign: 'center', lineHeight: 1.4 }}>
          Al elegir y crear, aceptás los <span style={{ color: 'var(--text-brand)' }}>Términos y Condiciones</span>.

      </div>
    </Screen>);

}

// ── Create / morph ──────────────────────────────────────────────
// Creación 100% visual, estilo Apple Pay sobre fondo claro: la tarjeta flota,
// baja y se "guarda" detrás del frente de una wallet, con un barrido de luz y
// un check + destello lime al completarse.
function MorphCreate({ fromDesign = 'violeta', toDesign, replace = false, onDone }) {
  const [phase, setPhase] = useStateCX(0); // 0 from · 1 morph · 2 bloom final
  useEffectCX(() => {
    const t1 = setTimeout(() => setPhase(1), 700);   // empieza a guardarse
    const t2 = setTimeout(() => setPhase(2), 1950);  // ya guardada: check + destello
    const done = setTimeout(onDone, 2900);
    return () => { clearTimeout(t1);clearTimeout(t2);clearTimeout(done); };
  }, []);

  const CARD_W = 268;

  // Estilo Apple Pay: la tarjeta flota y se "guarda" en la wallet con un destello.
  return (
    <Screen scroll={false} bg="#FFFFFF">
      <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <div style={{ position: 'relative', width: 320, height: 440, perspective: 1100 }}>

          {/* glow lime detrás del bolsillo */}
          <div style={{ position: 'absolute', left: '50%', bottom: 70, transform: 'translateX(-50%)', width: 250, height: 150, borderRadius: 999, filter: 'blur(48px)',
            background: 'radial-gradient(circle, rgba(207,255,46,0.55), transparent 70%)',
            opacity: phase >= 2 ? 1 : 0.35, transition: 'opacity .6s ease' }} />

          {/* tarjeta: flota arriba y baja a la wallet (z1, detrás del frente del bolsillo) */}
          <div style={{ position: 'absolute', left: '50%', top: 64, zIndex: 1, marginLeft: -CARD_W / 2,
            transform:
            phase === 0 ? 'translateY(0) scale(1) rotateX(0deg)' :
            phase === 1 ? 'translateY(126px) scale(0.86) rotateX(15deg)' :
            'translateY(118px) scale(0.86) rotateX(13deg)',
            transition: `transform 1.1s ${SPRING}`,
            filter: phase >= 1 ? 'drop-shadow(0 16px 22px rgba(0,0,0,0.30))' : 'drop-shadow(0 12px 26px rgba(0,0,0,0.16))',
            animation: phase === 0 ? 'lc-float 3.4s ease-in-out infinite' : 'none' }}>
            <div style={{ position: 'relative' }}>
              <CardArt design={toDesign} variant={replace ? undefined : undefined} width={CARD_W} glow shimmer={phase >= 1} />
              {/* barrido especular al guardarse */}
              <div style={{ position: 'absolute', inset: 0, borderRadius: 17, overflow: 'hidden', pointerEvents: 'none' }}>
                <div style={{ position: 'absolute', top: '-25%', bottom: '-25%', width: '42%', left: 0,
                  background: 'linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent)',
                  animation: phase >= 1 ? 'lc-sweep 2.2s ease-in-out .1s 2' : 'none' }} />
              </div>
            </div>
          </div>

          {/* frente de la wallet (z2): la tarjeta se mete por detrás */}
          <div style={{ position: 'absolute', left: '50%', bottom: 60, marginLeft: -150, width: 300, height: 132, zIndex: 2,
            borderRadius: 24, background: 'linear-gradient(180deg, #26262d 0%, #141418 100%)',
            boxShadow: '0 18px 30px rgba(0,0,0,0.22), inset 0 2px 0 rgba(255,255,255,0.14)',
            transform: phase >= 2 ? 'translateY(-4px)' : 'none', transition: `transform .5s ${SPRING}` }}>
            {/* ranura superior */}
            <div style={{ position: 'absolute', top: 12, left: 24, right: 24, height: 4, borderRadius: 999, background: 'rgba(255,255,255,0.10)' }} />
            {/* check al completarse */}
            {phase >= 2 &&
            <div style={{ position: 'absolute', left: '50%', top: -22, width: 44, height: 44, borderRadius: 999,
              background: 'var(--c-lime-40)', display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 6px 16px rgba(207,255,46,0.5)', animation: `lc-pop .5s ${SPRING} forwards` }}>
              <LI name="feedback-positive" size={24} color={LX.dark} />
            </div>}
          </div>

          {/* destello al guardarse */}
          {phase >= 2 &&
          <div key="flash" style={{ position: 'absolute', left: '50%', top: 210, marginLeft: -110, width: 220, height: 220, borderRadius: 999, pointerEvents: 'none', zIndex: 3,
            background: 'radial-gradient(circle, rgba(255,255,255,0.9), rgba(207,255,46,0.5) 40%, transparent 72%)',
            animation: 'lc-flash 0.8s ease-out forwards' }} />}
        </div>
      </div>
    </Screen>);

}

// Sirve para virtual / física / crédito. `expiring`+`onRenew`: vencimiento.
function CardHome({ design = 'violeta', variant = 'virtual', title, mask = '•••• 2291',
  balance = 0, startInWallet = false, expiring = false, peek = true,
  onRenew, onPay, onBack, onClose }) {
  const kind = variant === 'fisica' ? 'fisica' : variant === 'credito' ? 'credito' : 'virtual';
  const isVirtual = kind === 'virtual';
  const heading = title || { virtual: 'Tarjeta prepaga virtual', fisica: 'Lemon Card física', credito: 'Tarjeta crédito física' }[kind];

// ── Flujo completo (A o B) ──────────────────────────────────────
function FlowMigracion({ variant, onMenu }) {
  const [step, setStep] = useStateM('home');
  const [design, setDesign] = useStateM('tetrish');
  const [walletAdded, setWalletAdded] = useStateM(false);
  const [mailFrom, setMailFrom] = useStateM(null); // pantalla a la que vuelve el mail

  const openMail = (from) => { setMailFrom(from); setStep('mail'); };

  // "Quiero Apple Pay" → overlay de alta y a las tarjetas
  useEffectM(() => {
    if (step !== 'wallet') return;
    const t = setTimeout(() => setStep('hub'), 1800);
    return () => clearTimeout(t);
  }, [step]);

  if (step === 'home')
    return <Anim k="mig-home"><AppHome variant={variant} onCards={() => setStep('intro')} /></Anim>;

  if (step === 'intro')
    return <Anim k="mig-intro"><MigSplash onClose={() => setStep('home')} onPrimary={() => setStep('design')} onLater={() => setStep('home')} /></Anim>;

  if (step === 'design')
    return <Anim k="mig-design"><MigPicker onBack={() => setStep('intro')} onClose={() => setStep('home')} onChoose={(d) => { setDesign(d.id); setStep('compare'); }} /></Anim>;

  if (step === 'compare')
    return (
      <Anim k="mig-compare">
        <MigCompare variant={variant} design={design}
          onBack={() => setStep('design')} onClose={() => setStep('home')}
          onContinue={() => setStep('morph')} />
      </Anim>);

  if (step === 'morph')
    return <Anim k="mig-morph"><MorphCreate fromDesign="violeta" toDesign={design} replace onDone={() => setStep('ready')} /></Anim>;

  if (step === 'ready')
    return (
      <Anim k="mig-ready">
        <VirtualReady design={design} mask={NEW_MASK}
          onWallet={() => { setWalletAdded(true); setStep('wallet'); }}
          onSeeCard={() => setStep('hub')} onMenu={onMenu} />
      </Anim>);

  if (step === 'wallet')
    return (
      <Anim k="mig-wallet">
        <Screen scroll={false} bg="radial-gradient(120% 80% at 50% 38%, #1c1838 0%, #0a0a10 72%)">
          <div style={{ height: '100%' }} />
          <WalletAddOverlay open design={design} />
        </Screen>
      </Anim>);

  if (step === 'hub')
    return (
      <Anim k="mig-hub">
        <MigHub variant={variant} design={design} onBack={onMenu}
          onOldTap={() => setStep('old')} onNewTap={() => setStep('new')}
          onVerMail={() => openMail('hub')} />
      </Anim>);

  if (step === 'old')
    return (
      <Anim k="mig-old">
        <MigOldCard variant={variant}
          onBack={() => setStep('hub')} onClose={() => setStep('hub')}
          onGoNew={() => setStep('new')} onVerMail={() => openMail('old')} />
      </Anim>);

  if (step === 'new')
    return <Anim k="mig-new"><CardHome design={design} variant="virtual" title="Tarjeta prepaga virtual" mask={NEW_MASK} balance={1} startInWallet={walletAdded} onBack={() => setStep('hub')} onClose={() => setStep('hub')} /></Anim>;

  if (step === 'mail')
    return <Anim k="mig-mail"><MigEmail variant={variant} onBack={() => setStep(mailFrom || 'hub')} /></Anim>;

  return null;
}

// ── Stage root ──────────────────────────────────────────────────
function Stage() {
  const [view, setView] = useStateA('menu'); // menu | migA | migB
  const [scale, setScale] = useStateA(1);

  useEffectA(() => {
    const calc = () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      setScale(Math.min(1, (vh - 132) / 874, (vw - 48) / 402));
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  const toMenu = () => setView('menu');

  return (
    <div style={{ minHeight: '100vh', background: '#E6E5E1', display: 'flex', flexDirection: 'column', fontFamily: 'Inter, system-ui' }}>
      {/* control strip */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 20px', borderBottom: '1px solid #D6D5D0', background: '#EFEEEA', flexWrap: 'wrap' }}>
        <span style={{ width: 26, height: 26, borderRadius: 999, background: LX.dark, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Leaf size={15} color="var(--c-lime-40)" vein="rgba(0,0,0,0.3)" />
        </span>
        <div style={{ font: '600 13px Inter', color: '#2a2a28' }}>Migración virtual GP → Pomelo <span style={{ color: '#8a8985', fontWeight: 500 }}>· test A/B</span></div>

        {view !== 'menu' &&
        <>
          <button onClick={toMenu} style={{ display: 'flex', alignItems: 'center', gap: 6, border: '1px solid #D0CFCA', background: '#fff', borderRadius: 999, padding: '6px 14px', cursor: 'pointer', font: '600 12px Inter', color: '#2a2a28' }}>
            <LI name="arrow-back" size={14} color="#2a2a28" /> Menú
          </button>
          <span style={{ font: '600 12px Inter', color: '#8a8985' }}>
            {view === 'migA' ? 'Camino A · débitos al frente · 10 días' : 'Camino B · convivencia · 30 días'}
          </span>
        </>
        }
      </div>

      {/* body */}
      <div style={{ flex: 1, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '24px 24px 28px', gap: 28 }}>
        <Phone scale={scale}>
          {view === 'menu' && <MenuScreen onPick={setView} />}
          {view === 'migA' && <FlowMigracion variant="A" onMenu={toMenu} />}
          {view === 'migB' && <FlowMigracion variant="B" onMenu={toMenu} />}
        </Phone>
      </div>
    </div>);

}
